name: Release

# Cut a release:
#
#   npm run release -- 0.2.0 --push      # bumps plugin.json+package.json, commits, tags, pushes
#
# The tag push runs the shared release workflow (jaysuk/dwc-plugin-workflows), which builds
# DuetToolAlign-<version>.zip against DWC and publishes a Release with a pun title and generated notes.
# Run it by hand (Actions -> Release -> Run workflow) for a dry run: it builds the ZIP as an artifact and
# shows the title and notes in the run summary, publishing nothing.
#
# Plugin-specific bits: scripts/release-titles.txt (the puns), .github/release-footer.md (extra notes in
# the footer), and the `release:prepare` npm script (fetches the bundled OpenCV.js before packaging).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: DuetWebControl branch/tag/sha to build against
        default: v3.7-dev

permissions:
  contents: write # the shared workflow creates the Release and uploads the asset

jobs:
  release:
    uses: jaysuk/dwc-plugin-workflows/.github/workflows/release.yml@v1
    with:
      dwc-ref: ${{ inputs.dwc-ref }}
